[build-system]
requires = ["setuptools==84.2.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqrp"
version = "0.5.0.dev1"
description = "Restricted engineering research, portfolios and deterministic event backtesting (Phase 5)"
requires-python = "==3.13.16"
dependencies = [
  "numpy==2.5.4", "pandas==3.0.6", "pyarrow==26.0.0",
  "duckdb==1.5.6", "tzdata==2026.5", "packaging==26.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1", "pytest-cov==7.1.0", "hypothesis==6.170.5",
  "ruff==0.17.1", "pip==26.2.1", "uv==0.13.4",
  "setuptools==84.2.0", "wheel==0.48.0",
]

[project.scripts]
aqrp-research = "aqrp.services.cli:main"
aqrp-backtest = "aqrp.services.backtest_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aqrp.factors" = ["reviewed_code.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "tools/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["aqrp"]

[tool.coverage.report]
show_missing = true
