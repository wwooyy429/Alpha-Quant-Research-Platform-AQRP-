name: Phase 4 quality
on:
  pull_request:
  push:
    branches: [feature/phase-3-alpha-research]
permissions:
  contents: read
jobs:
  data-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Clean hashed install, wheel, tests and evidence
        env:
          AQRP_RUN_ROOT: ${{ runner.temp }}/aqrp-evidence
        run: python tools/ci.py
      - name: Upload raw evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase4-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aqrp-evidence/*/*.log
            ${{ runner.temp }}/aqrp-evidence/*/*.json
            ${{ runner.temp }}/aqrp-evidence/*/*.xml
            ${{ runner.temp }}/aqrp-evidence/*/dataset/**/*
            ${{ runner.temp }}/aqrp-evidence/*/.coverage
            ${{ runner.temp }}/aqrp-evidence/*/wheel/*.whl
            ${{ runner.temp }}/aqrp-evidence/*/factor-dataset/**/*
            ${{ runner.temp }}/aqrp-evidence/*/factor-runs/**/*
            ${{ runner.temp }}/aqrp-evidence/*/research/**/*
            ${{ runner.temp }}/aqrp-evidence/*/portfolio/**/*
            ${{ runner.temp }}/aqrp-evidence/*/reproduction/*.json
            ${{ runner.temp }}/aqrp-evidence/*/reproduction/*.log
            ${{ runner.temp }}/aqrp-evidence/*/reproduction/dataset/**/*
            ${{ runner.temp }}/aqrp-evidence/*/reproduction/wheelhouse/*.whl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
